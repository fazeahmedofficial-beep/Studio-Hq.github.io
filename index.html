<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio HQ</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#121214">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#121214;--panel:#1a1a1d;--line:#2a2a2f;--tx:#f1efe9;--mut:#8d8b93;--ac:#9fb4ff;--ok:#7bd49a;--warn:#f0b36b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f4f0;--panel:#fff;--line:#e2e0d9;--tx:#1b1b1f;--mut:#74727a;--ac:#3f56d9;--ok:#1f8a4c;--warn:#b86a12;color-scheme:light}}
:root[data-theme="dark"]{--bg:#121214;--panel:#1a1a1d;--line:#2a2a2f;--tx:#f1efe9;--mut:#8d8b93;--ac:#9fb4ff;--ok:#7bd49a;--warn:#f0b36b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 "Instrument Sans",system-ui,sans-serif}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px}
nav h1{font-size:16px;margin:0 8px 14px;font-weight:600}
nav button{all:unset;cursor:pointer;padding:7px 10px;border-radius:8px;color:var(--mut);display:flex;justify-content:space-between}
nav button:hover,nav button.on{background:var(--panel);color:var(--tx)}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{padding:28px 32px;max-width:1100px;width:100%}
h2{font-size:26px;font-weight:500;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 22px}
h3{font-size:14px;font-weight:600;margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:16px}
.stats div{padding:14px 16px;border-right:1px solid var(--line)}.stats div:last-child{border:0}
.stats b{display:block;font-size:24px;font-weight:500}.stats span,.mut{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid.p{grid-template-columns:2fr 1fr}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.btn{all:unset;cursor:pointer;border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--mut)}.btn.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.x{color:var(--mut);cursor:pointer;background:none;border:0;font:inherit}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;min-width:0}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.add input{flex:1;min-width:120px}
.pill{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}
.phases{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.phases button{all:unset;cursor:pointer;padding:12px 14px;background:var(--panel);border-right:1px solid var(--line);color:var(--mut)}
.phases button.done{color:var(--tx)}.phases button.cur{background:var(--bg);color:var(--tx);box-shadow:inset 0 -2px var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .d{min-height:78px;border:1px solid var(--line);border-radius:8px;padding:5px;background:var(--panel);cursor:pointer;font-size:12px;overflow:hidden}
.cal .d.t{border-color:var(--ac)}.cal .d.sel{background:var(--bg)}.cal .h{color:var(--mut);font-size:12px;padding:2px 5px}
.ev{display:block;margin-top:2px;padding:1px 5px;border-radius:5px;background:color-mix(in srgb,var(--ac) 22%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.tk{background:color-mix(in srgb,var(--warn) 22%,transparent)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
@media (max-width:760px){.app{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}nav h1{display:none}main{padding:18px 14px}.grid{grid-template-columns:1fr}.grid.p{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.cal .d{min-height:56px}}
</style></head><body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<script>
const K='studiohq-v1',today=new Date().toISOString().slice(0,10);
const PH=['Discovery','Strategy','Design','Delivery'];
const seed={clients:[{id:1,name:'Bloom Ventures',kind:'Rebrand',phase:2,due:'2026-11-28'},{id:2,name:'Viral Toolkit',kind:'Brand sprint',phase:0,due:'2026-12-10'}],
tasks:[{id:1,t:'Send the pitch deck template',client:1,date:today,done:false},{id:2,t:'Prepare proposal walkthrough',client:2,date:today,done:false}],
events:[{id:1,t:'Proposal walkthrough call',client:2,date:today}],
invoices:[{id:1,client:1,amt:7680,status:'unpaid',due:'2026-11-05'}],expenses:[{id:1,t:'Font licence',amt:1200,date:today}]};
let S;try{S=JSON.parse(localStorage.getItem(K))||seed}catch(e){S=seed}
let V='home',PV=null,CT='dashboard',BD=null,WS=0,HP=false,PR=0,FT='o',TF='all',Q='',ES=null,SAC=false,CID=null,CAL=new Date(),SEL=today,idn=100;
const DEFP=[{n:'Discovery',d:'Where the project starts: the paperwork, then the workshop.',steps:[{t:'Proposal',k:'The proposal',tasks:[]},{t:'Contract',k:'The contract',tasks:[]},{t:'Deposit invoice',k:'An invoice',tasks:[]},{t:'Discovery workshop',k:'The workshop',tasks:[]}]},{n:'Strategy',d:'Turn what you learned into a direction.',steps:[{t:'Strategy document',k:'A document',tasks:[]},{t:'Strategy presentation',k:'A document',tasks:[]}]},{n:'Design',d:'Make the identity.',steps:[{t:'Concept presentation',k:'A document',tasks:[]},{t:'Final presentation',k:'A document',tasks:[]},{t:'Give feedback on the direction',k:'A document',tasks:[]}]},{n:'Delivery',d:'Hand it all over.',steps:[{t:'Final files',k:'A document',tasks:[]},{t:'Final invoice',k:'An invoice',tasks:[]},{t:'Brand Hub',k:'A document',tasks:[]}]}];
S.subs=S.subs||[];S.process=S.process||DEFP;S.team=S.team||[];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cn=id=>(S.clients.find(c=>c.id==id)||{}).name||'No client';
const money=n=>'E£'+Number(n).toLocaleString();
const $=id=>document.getElementById(id), val=id=>$(id).value.trim();
const copts=()=>'<option value="">No client</option>'+S.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
const go=(v,c)=>{V=v;CID=c||null;PV=null;CT='dashboard';BD=null;SAC=false;render()};
const upd=f=>{f();save();render()};

function render(){
 const nav=[['home','Home'],['tasks','Tasks',S.tasks.filter(t=>!t.done).length],['calendar','Calendar'],['finance','Finance'],['processes','Processes'],['team','Team'],['alerts','Alerts',alertN()||''],['clients','Clients',S.clients.length]];
 $('nav').innerHTML='<h1>Studio HQ</h1><input id="q" aria-label="Search" placeholder="Search" value="'+esc(Q)+'" oninput="srch(this.value)" style="margin:0 6px 8px">'+nav.map(n=>`<button class="${V==n[0]||(V=='client'&&n[0]=='clients')?'on':''}" onclick="go('${n[0]}')">${n[1]}<span class="mut">${n[2]??''}</span></button>`).join('');
 const c0=S.clients.find(x=>x.id==CID);if(V=='client'&&c0)$('nav').innerHTML=`<button onclick="go('clients')">All clients</button><h1 style="margin-top:10px">${esc(c0.name)}</h1><button onclick="SAC=true;render()">See as client</button>`+CTABS.map(t=>`<button class="${CT==t[0]?'on':''}" onclick="CT='${t[0]}';BD=null;render()">${t[1]}</button>`).join('');
 $('main').innerHTML=({home,tasks,calendar,finance,processes,team,search,alerts,clients,client})[V]();if(V=='client'&&CT=='boards'&&BD&&!SAC)initCv();
}
function taskRow(t){return `<div class="row"><input type="checkbox" aria-label="Done" ${t.done?'checked':''} onchange="upd(()=>S.tasks.find(x=>x.id==${t.id}).done=this.checked)"><div class="grow" style="${t.done?'opacity:.5;text-decoration:line-through':''}">${esc(t.t)}<div class="mut">${esc(cn(t.client))}${t.date?' · '+t.date:''}</div></div><button class="x" aria-label="Delete task" onclick="upd(()=>S.tasks=S.tasks.filter(x=>x.id!=${t.id}))">✕</button></div>`}
function home(){
 const unpaid=S.invoices.filter(i=>i.status!='paid'),open=S.tasks.filter(t=>!t.done);
 const up=[...S.events.filter(e=>e.date>=today)].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
 return `<h2>Welcome back to your HQ</h2><p class="sub">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</p>
 <div class="stats"><div><span>Clients</span><b>${S.clients.length}</b></div><div><span>Active projects</span><b>${S.clients.filter(c=>c.phase<4).length}</b></div><div><span>Open tasks</span><b>${open.length}</b></div><div><span>Unpaid</span><b>${money(unpaid.reduce((a,i)=>a+i.amt,0))}</b></div></div>
 <div class="grid"><div class="card"><h3>Today</h3>${open.filter(t=>t.date<=today).map(taskRow).join('')||'<p class="mut">Nothing due today. Add a task from Tasks.</p>'}</div>
 <div class="card"><h3>Coming up</h3>${up.map(e=>`<div class="row"><div class="grow">${esc(e.t)}<div class="mut">${esc(cn(e.client))}</div></div><span class="mut">${e.date}</span></div>`).join('')||'<p class="mut">No events yet. Add one in Calendar.</p>'}</div></div>
 <div class="card"><h3>Clients</h3>${S.clients.map(c=>`<div class="row"><button class="x" style="color:var(--tx)" onclick="go('client',${c.id})">${esc(c.name)}</button><span class="mut grow">${esc(c.kind)}</span><span class="pill">${PH[Math.min(c.phase,3)]}</span></div>`).join('')}</div>`}
function tasksOld(){return `<h2>Tasks</h2><p class="sub">${S.tasks.filter(t=>!t.done).length} open</p><div class="card">${[...S.tasks].sort((a,b)=>a.done-b.done).map(taskRow).join('')||'<p class="mut">No tasks yet.</p>'}
 <div class="add"><input id="tt" placeholder="New task"><select id="tc">${copts()}</select><input id="td" type="date" value="${today}"><button class="btn pri" onclick="addTask()">Add task</button></div></div>`}
function addTask(){const t=val('tt');if(!t)return;upd(()=>S.tasks.push({id:++idn+Date.now(),t,client:val('tc'),date:val('td'),created:today,done:false}))}
function calendar(){
 const y=CAL.getFullYear(),m=CAL.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
 let cells=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="h">${d}</div>`).join('')+'<div></div>'.repeat(first);
 for(let d=1;d<=days;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const it=S.events.filter(e=>e.date==ds).map(e=>`<span class="ev">${esc(e.t)}</span>`).join('')+S.tasks.filter(t=>t.date==ds&&!t.done).map(t=>`<span class="ev tk">${esc(t.t)}</span>`).join('');
  cells+=`<div class="d ${ds==today?'t':''} ${ds==SEL?'sel':''}" onclick="SEL='${ds}';render()">${d}${it}</div>`}
 const evs=S.events.filter(e=>e.date==SEL);
 return `<h2>Calendar</h2><div class="tabs"><button class="btn" onclick="CAL=new Date(CAL.getFullYear(),CAL.getMonth()-1,1);render()">Previous</button><span style="padding:6px 8px">${CAL.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</span><button class="btn" onclick="CAL=new Date(CAL.getFullYear(),CAL.getMonth()+1,1);render()">Next</button></div>
 <div class="cal">${cells}</div><div class="card" style="margin-top:16px"><h3>${SEL}</h3>${evs.map(e=>`<div class="row"><div class="grow">${esc(e.t)}<div class="mut">${esc(cn(e.client))}</div></div><button class="x" aria-label="Delete event" onclick="upd(()=>S.events=S.events.filter(x=>x.id!=${e.id}))">✕</button></div>`).join('')||'<p class="mut">No events on this day.</p>'}
 <div class="add"><input id="et" placeholder="New event"><select id="ec">${copts()}</select><button class="btn pri" onclick="addEv()">Add event</button></div></div>`}
function addEv(){const t=val('et');if(!t)return;upd(()=>S.events.push({id:++idn+Date.now(),t,client:val('ec'),date:SEL}))}
function finance(){if(FT=='s')return subs();
 const paid=S.invoices.filter(i=>i.status=='paid').reduce((a,i)=>a+i.amt,0),un=S.invoices.filter(i=>i.status!='paid').reduce((a,i)=>a+i.amt,0),ex=S.expenses.reduce((a,e)=>a+e.amt,0);
 return `<h2>Finance</h2>${finTabs()}
 <div class="stats"><div><span>Paid</span><b>${money(paid)}</b></div><div><span>Unpaid</span><b>${money(un)}</b></div><div><span>Expenses</span><b>${money(ex)}</b></div><div><span>Net</span><b>${money(paid-ex)}</b></div></div>
 ${finChart()}<div class="grid"><div class="card"><h3>Invoices</h3>${invList(S.invoices)}<div class="add"><select id="ic">${copts()}</select><input id="ia" type="number" min="0" placeholder="Amount"><button class="btn pri" onclick="addInv()">Create invoice</button></div></div>
 <div class="card"><h3>Expenses</h3>${S.expenses.map(e=>`<div class="row"><div class="grow">${esc(e.t)}<div class="mut">${e.date}</div></div>${money(e.amt)}<button class="x" aria-label="Delete expense" onclick="upd(()=>S.expenses=S.expenses.filter(x=>x.id!=${e.id}))">✕</button></div>`).join('')||'<p class="mut">No expenses logged.</p>'}
 <div class="add"><input id="xt" placeholder="What for"><input id="xa" type="number" min="0" placeholder="Amount"><button class="btn pri" onclick="addExp()">Log expense</button></div></div></div>`}
function invList(l){return l.map(i=>`<div class="row"><div class="grow">${esc(cn(i.client))}<div class="mut">Due ${i.due||'—'}</div></div>${money(i.amt)}<button class="pill ${i.status=='paid'?'ok':'warn'}" style="cursor:pointer;background:none" onclick="upd(()=>S.invoices.find(x=>x.id==${i.id}).status='${i.status=='paid'?'unpaid':'paid'}',S.invoices.find(x=>x.id==${i.id}).paidOn=today)">${i.status=='paid'?'Paid':'Mark paid'}</button><button class="x" aria-label="Delete invoice" onclick="upd(()=>S.invoices=S.invoices.filter(x=>x.id!=${i.id}))">✕</button></div>`).join('')||'<p class="mut">No invoices yet.</p>'}
function addInv(){const a=+val('ia');if(!a)return;upd(()=>S.invoices.push({id:++idn+Date.now(),client:val('ic'),amt:a,status:'unpaid',due:''}))}
function addExp(){const t=val('xt'),a=+val('xa');if(!t||!a)return;upd(()=>S.expenses.push({id:++idn+Date.now(),t,amt:a,date:today}))}
function clients(){return `<h2>Clients</h2><p class="sub">One room per client</p><div class="card">${S.clients.map(c=>`<div class="row"><button class="x" style="color:var(--tx)" onclick="go('client',${c.id})">${esc(c.name)}</button><span class="mut grow">${esc(c.kind)}</span><span class="pill">${PH[Math.min(c.phase,3)]}</span><button class="x" aria-label="Delete client" onclick="upd(()=>S.clients=S.clients.filter(x=>x.id!=${c.id}))">✕</button></div>`).join('')||'<p class="mut">No clients yet.</p>'}
 <div class="add"><input id="cn" placeholder="Client name"><input id="ck" placeholder="Project (e.g. Rebrand)"><input id="cd" type="date"><button class="btn pri" onclick="addCl()">Add client</button></div></div>`}
function addCl(){const name=val('cn');if(!name)return;upd(()=>S.clients.push({id:++idn+Date.now(),name,kind:val('ck')||'Project',phase:0,started:today,due:val('cd')}))}
function addPerson(cid){const n=val('pp');if(!n)return;upd(()=>{const c=S.clients.find(x=>x.id==cid);(c.people=c.people||[]).push(n)})}
function stepRow(cid,p,s){const nx={Draft:'In progress','In progress':'Done',Done:'Draft'}[s.status];return `<div class="row"><div class="grow" style="${s.status=='Done'?'opacity:.5;text-decoration:line-through':''}">${esc(s.t)}</div><button class="pill ${s.status=='Done'?'ok':s.status=='In progress'?'warn':''}" style="cursor:pointer;background:none" aria-label="Change step status" onclick="upd(()=>S.clients.find(x=>x.id==${cid}).steps[${p}].find(x=>x.id==${s.id}).status='${nx}')">${s.status}</button><button class="x" aria-label="Delete step" onclick="upd(()=>{const c=S.clients.find(x=>x.id==${cid});c.steps[${p}]=c.steps[${p}].filter(x=>x.id!=${s.id})})">✕</button></div>`}
function addStep(cid,p){const t=val('st');if(!t)return;upd(()=>{const c=S.clients.find(x=>x.id==cid);c.steps=c.steps||{};(c.steps[p]=c.steps[p]||[]).push({id:++idn+Date.now(),t,status:'Draft'})})}
const CTABS=[['dashboard','Dashboard'],['tasks','Tasks'],['invoices','Invoices'],['documents','Documents'],['library','Library'],['boards','Boards'],['workshop','Discovery workshop'],['hub','Brand Hub'],['artifacts','Artifacts'],['settings','Client settings']];
const WSN=['Introduction','The Golden Circle','Growth Timeline','Target Audience','Brand Personality','Positioning','Voice','External Inspiration'],HUBN=['Strategy','Gallery','Logo','Typography','Colour','Photography','Layout','Resources'],DST=['Draft','With the client','Accepted','Signed'];
const cl=id=>S.clients.find(x=>x.id==id),setv=(id,k,v)=>upd(()=>cl(id)[k]=v);
function wsd(c){if(!c.ws)c.ws=WSN.map((n,i)=>({n,q:i==0?['What’s the brand’s name?','What’s your origin story?','Why did you choose your brand name?','What’s the current state of the business and brand?']:[]}));return c.ws}
function simple(c,key,title,ph){const l=c[key]||[];return `<h2>${title}</h2><div class="card">${l.map(x=>`<div class="row"><div class="grow">${esc(x.t)}</div><button class="x" aria-label="Delete" onclick="upd(()=>cl(${c.id}).${key}=cl(${c.id}).${key}.filter(y=>y.id!=${x.id}))">✕</button></div>`).join('')||'<p class="mut">Nothing here yet.</p>'}<div class="add"><input id="si" placeholder="${ph}"><button class="btn pri" onclick="addSimple(${c.id},'${key}')">Add</button></div></div>`}
function addSimple(id,k){const t=val('si');if(!t)return;upd(()=>{const c=cl(id);(c[k]=c[k]||[]).push({id:Date.now(),t})})}
function addTaskFor(id){const t=val('tt');if(!t)return;upd(()=>S.tasks.push({id:Date.now(),t,client:id,date:val('td'),created:today,done:false}))}
function addInvFor(id){const a=+val('ia');if(!a)return;upd(()=>S.invoices.push({id:Date.now(),client:id,amt:a,status:'unpaid',due:''}))}
function addDoc(id){const t=val('dn');if(!t)return;upd(()=>{const c=cl(id);(c.docs=c.docs||[]).push({id:Date.now(),t,kind:val('dk'),status:'Draft',date:today})})}
function addBoard(id){const t=val('bn');if(!t)return;upd(()=>{const c=cl(id);(c.boards=c.boards||[]).push({id:Date.now(),t,notes:[]})})}
function addNote(id,b){const t=val('nt');if(!t)return;upd(()=>cl(id).boards.find(x=>x.id==b).notes.push({id:Date.now(),t}))}
function addQ(id){const t=val('wq');if(!t)return;upd(()=>wsd(cl(id))[WS].q.push(t))}
function setHub(id,n,v){const c=cl(id);c.hub=c.hub||{pub:false,text:{}};c.hub.text[n]=v;save()}
function togglePub(id){upd(()=>{const c=cl(id);c.hub=c.hub||{pub:false,text:{}};c.hub.pub=!c.hub.pub})}
function clientPage(c){const id=c.id;switch(CT){
case 'tasks':return `<h2>Tasks</h2><div class="card">${S.tasks.filter(t=>t.client==id).map(taskRow).join('')||'<p class="mut">No tasks for this client.</p>'}<div class="add"><input id="tt" placeholder="New task"><input id="td" type="date" value="${today}"><button class="btn pri" onclick="addTaskFor(${id})">New task</button></div></div>`;
case 'invoices':return `<h2>Invoices</h2><div class="card">${invList(S.invoices.filter(i=>i.client==id))}<div class="add"><input id="ia" type="number" min="0" placeholder="Amount"><button class="btn pri" onclick="addInvFor(${id})">Create invoice</button></div></div>`;
case 'documents':{const D=c.docs||[];return `<h2>Documents</h2><div class="grid">${D.map(d=>`<div class="card"><b>${esc(d.t)}</b><div class="mut">${d.kind}, ${d.date}</div><div class="add"><button class="pill ${d.status=='Accepted'||d.status=='Signed'?'ok':d.status=='With the client'?'warn':''}" style="cursor:pointer;background:none" onclick="upd(()=>{const d=cl(${id}).docs.find(y=>y.id==${d.id});d.status=DST[(DST.indexOf(d.status)+1)%4]})">${d.status}</button><button class="x" aria-label="Delete document" onclick="upd(()=>cl(${id}).docs=cl(${id}).docs.filter(y=>y.id!=${d.id}))">✕</button></div></div>`).join('')}</div>${D.length?'':'<p class="mut">No documents yet. Create the proposal first.</p>'}<div class="add"><input id="dn" placeholder="Document name"><select id="dk"><option>Proposal</option><option>Contract</option><option>Strategy</option><option>Other</option></select><button class="btn pri" onclick="addDoc(${id})">New document</button></div>`}
case 'library':return simple(c,'library','Library','File name or link');
case 'artifacts':return simple(c,'artifacts','Artifacts','Artifact name');
case 'boards':{if(BD){const b=(c.boards||[]).find(x=>x.id==BD);if(b)return `<p><button class="x" onclick="BD=null;render()">Back to boards</button></p><h2>${esc(b.t)}</h2><p class="sub"><span class="pill">Studio only</span></p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">${b.notes.map(n=>`<div class="card" style="background:#f3d96b;color:#222;min-height:100px">${esc(n.t)}<div><button class="x" style="color:#222" aria-label="Delete note" onclick="upd(()=>{const b=cl(${id}).boards.find(y=>y.id==${b.id});b.notes=b.notes.filter(y=>y.id!=${n.id})})">✕</button></div></div>`).join('')}</div>${b.notes.length?'':'<p class="mut">Nothing here yet. Add a note below.</p>'}<h3 style="margin-top:14px">Canvas</h3><div class="tabs"><button class="btn" onclick="TOOL='pen'">Pen</button><button class="btn" onclick="TOOL='eraser'">Eraser</button><button class="btn" onclick="clearCv()">Clear</button><label class="btn">Add image<input type="file" accept="image/*" hidden onchange="addImg(this)"></label></div><canvas id="cv" width="700" height="320" style="width:100%;background:#fff;border-radius:8px;touch-action:none"></canvas><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${(b.imgs||[]).map(s=>`<img src="${s}" alt="Board image" style="max-width:150px;border-radius:8px">`).join('')}</div><div class="add"><input id="nt" placeholder="Write a note"><button class="btn pri" onclick="addNote(${id},${b.id})">Add note</button></div>`}
return `<h2>Boards</h2><div class="card">${(c.boards||[]).map(b=>`<div class="row"><button class="x" style="color:var(--tx)" onclick="BD=${b.id};render()">${esc(b.t)}</button><span class="mut grow">${b.notes.length} notes</span><button class="x" aria-label="Delete board" onclick="upd(()=>cl(${id}).boards=cl(${id}).boards.filter(y=>y.id!=${b.id}))">✕</button></div>`).join('')||'<p class="mut">Nothing here yet. Add a board for moodboards or a review round.</p>'}<div class="add"><input id="bn" placeholder="Board name"><button class="btn pri" onclick="addBoard(${id})">Add board</button></div></div>`}
case 'workshop':{const w=wsd(c),s=w[WS]||w[0];return `<h2>Discovery workshop</h2><p class="sub">The workshop’s questions</p><div class="grid p"><div class="card"><h3>${s.n}</h3>${s.q.map((q,i)=>`<div class="row"><span class="mut">${i+1}</span><div class="grow">${esc(q)}</div><button class="x" aria-label="Delete question" onclick="upd(()=>wsd(cl(${id}))[${WS}].q.splice(${i},1))">✕</button></div>`).join('')||'<p class="mut">No questions in this section yet.</p>'}<div class="add"><input id="wq" placeholder="Add a question"><button class="btn pri" onclick="addQ(${id})">Add question</button></div></div><div class="card"><h3>Sections</h3>${w.map((x,i)=>`<div class="row"><button class="x" style="color:${i==WS?'var(--ac)':'var(--tx)'}" onclick="WS=${i};render()">${i+1}. ${x.n}</button><span class="mut grow" style="text-align:right">${x.q.length}</span></div>`).join('')}</div></div>`}
case 'hub':{const H=c.hub||{pub:false,text:{}};const body=HUBN.map(n=>HP?`<h3 style="font-size:20px;margin-top:20px">${n}</h3><p>${esc(H.text[n]||'')}</p>`:`<h3>${n}</h3><textarea aria-label="${n}" style="width:100%;min-height:60px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;margin-bottom:12px" onchange="setHub(${id},'${n}',this.value)">${esc(H.text[n]||'')}</textarea>`).join('');return `<h2>Brand Hub</h2><div class="tabs"><span class="pill ${H.pub?'ok':'warn'}" style="align-self:center">${H.pub?'Published':'Draft'}</span><button class="btn ${HP?'':'pri'}" onclick="HP=false;render()">Edit</button><button class="btn ${HP?'pri':''}" onclick="HP=true;render()">Preview</button><button class="btn" onclick="togglePub(${id})">${H.pub?'Unpublish':'Publish'}</button></div><div class="card">${HP?`<h2 style="font-size:32px">${esc(c.name)} Brand Hub</h2>`:''}${body}</div>`}
case 'settings':return `<h2>Client settings</h2><div class="card"><div class="row"><span class="grow mut">Name</span><input value="${esc(c.name)}" aria-label="Client name" onchange="setv(${id},'name',this.value)"></div><div class="row"><span class="grow mut">Project due</span><input type="date" value="${c.due||''}" aria-label="Due date" onchange="setv(${id},'due',this.value)"></div><div class="add"><button class="btn" onclick="upd(()=>{S.clients=S.clients.filter(x=>x.id!=${id});go('clients')})">Delete client</button></div></div>`}}
let TOOL='pen';
function tasks(){const L=S.tasks.filter(t=>TF=='all'||(TF=='todo')==!t.done);return `<h2>Tasks</h2><div class="tabs">${[['all','All'],['todo','To do'],['done','Done']].map(x=>`<button class="btn ${TF==x[0]?'pri':''}" onclick="TF='${x[0]}';render()">${x[1]} ${S.tasks.filter(t=>x[0]=='all'||(x[0]=='todo')==!t.done).length}</button>`).join('')}</div><div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:520px"><tr class="mut" style="text-align:left"><th></th><th>Task</th><th>Client</th><th>Due date</th><th>Created</th><th></th></tr>${L.map(t=>`<tr style="border-top:1px solid var(--line)"><td><input type="checkbox" aria-label="Done" ${t.done?'checked':''} onchange="upd(()=>S.tasks.find(x=>x.id==${t.id}).done=this.checked)"></td><td style="padding:8px 6px;${t.done?'opacity:.5;text-decoration:line-through':''}">${esc(t.t)}</td><td>${esc(cn(t.client))}</td><td style="color:${t.date&&t.date<today&&!t.done?'var(--warn)':'inherit'}">${t.date==today?'Today':t.date||'—'}</td><td class="mut">${t.created||'—'}</td><td><button class="x" aria-label="Delete task" onclick="upd(()=>S.tasks=S.tasks.filter(x=>x.id!=${t.id}))">✕</button></td></tr>`).join('')}</table>${L.length?'':'<p class="mut">No tasks here.</p>'}<div class="add"><input id="tt" placeholder="New task"><select id="tc">${copts()}</select><input id="td" type="date" value="${today}"><button class="btn pri" onclick="addTask()">New task</button></div></div>`}
function finChart(){const y=new Date().getFullYear(),m=Array(12).fill(0),byc={};S.invoices.filter(i=>i.status=='paid').forEach(i=>{const d=new Date(i.paidOn||i.due||today);if(d.getFullYear()==y)m[d.getMonth()]+=i.amt;byc[cn(i.client)]=(byc[cn(i.client)]||0)+i.amt});let a=0;const c=m.map(v=>a+=v),mx=Math.max(1,a);return `<div class="card"><h3>Received this year</h3><svg viewBox="0 0 700 140" style="width:100%" role="img" aria-label="Cumulative money received by month"><polyline fill="none" stroke="var(--ok)" stroke-width="2" points="${c.map((v,i)=>`${30+i*55},${120-v/mx*100}`).join(' ')}"/>${['J','F','M','A','M','J','J','A','S','O','N','D'].map((l,i)=>`<text x="${30+i*55}" y="136" fill="var(--mut)" font-size="11" text-anchor="middle">${l}</text>`).join('')}</svg><h3 style="margin-top:12px">Money received by client</h3>${Object.entries(byc).map(([k,v])=>`<div class="row"><span style="width:140px">${esc(k)}</span><div class="grow" style="background:var(--bg);border-radius:4px;height:8px"><div style="width:${Math.round(v/Math.max(1,Object.values(byc).reduce((p,q)=>p+q,0))*100)}%;height:8px;border-radius:4px;background:var(--ok)"></div></div><span>${money(v)}</span></div>`).join('')||'<p class="mut">Mark an invoice paid to see it here.</p>'}</div>`}
function subModal(){const s=S.subs.find(x=>x.id==ES);if(!s){ES=null;return''}const f=(l,k,t)=>`<label class="mut" style="display:block;margin-top:8px">${l}<input id="e${k}" type="${t}" value="${esc(s[k]||'')}" style="width:100%;display:block"></label>`;return `<div style="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:5" role="dialog" aria-label="Edit subscription"><div class="card" style="width:min(420px,92vw);margin:0"><h3>Edit subscription</h3>${f('Name','n','text')}${f('Amount','amt','number')}${f('Next payment','next','date')}<label class="mut" style="display:block;margin-top:8px">Billing cycle<select id="ecycle" style="width:100%;display:block"><option ${s.cycle=='Monthly'?'selected':''}>Monthly</option><option ${s.cycle=='Yearly'?'selected':''}>Yearly</option></select></label><div class="add"><button class="btn" onclick="ES=null;render()">Cancel</button><button class="btn pri" onclick="saveSub()">Save</button></div></div></div>`}
function saveSub(){const s=S.subs.find(x=>x.id==ES);upd(()=>{s.n=val('en')||s.n;s.amt=+val('eamt')||s.amt;s.next=val('enext');s.cycle=val('ecycle');ES=null})}
function initCv(){const cv=$('cv');if(!cv)return;const x=cv.getContext('2d'),b=cl(CID).boards.find(y=>y.id==BD);if(b.draw){const i=new Image();i.onload=()=>x.drawImage(i,0,0);i.src=b.draw}let on=false;const p=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};cv.onpointerdown=e=>{on=true;const[a,c]=p(e);x.beginPath();x.moveTo(a,c)};cv.onpointermove=e=>{if(!on)return;const[a,c]=p(e);x.lineWidth=TOOL=='pen'?3:18;x.lineCap='round';x.strokeStyle=TOOL=='pen'?'#222':'#fff';x.lineTo(a,c);x.stroke()};cv.onpointerup=cv.onpointerleave=()=>{if(on){on=false;try{b.draw=cv.toDataURL();save()}catch(e){}}}}
function clearCv(){const b=cl(CID).boards.find(y=>y.id==BD);b.draw='';save();render()}
function addImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,300/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);const b=cl(CID).boards.find(y=>y.id==BD);(b.imgs=b.imgs||[]).push(c.toDataURL('image/jpeg',.7));save();render()};i.src=r.result};r.readAsDataURL(f)}
function team(){return `<h2>Team</h2><p class="sub">Up to 3 team members</p><div class="card">${S.team.map(m=>`<div class="row"><div class="grow">${esc(m.n)}<div class="mut">${esc(m.role)}${m.email?', '+esc(m.email):''}</div></div><button class="x" aria-label="Remove member" onclick="upd(()=>S.team=S.team.filter(x=>x.id!=${m.id}))">✕</button></div>`).join('')||'<p class="mut">Just you for now. Add a team member.</p>'}${S.team.length<3?`<div class="add"><input id="mn" placeholder="Name"><input id="me" placeholder="Email"><select id="mr"><option>Designer</option><option>Project manager</option><option>Admin</option></select><button class="btn pri" onclick="addMem()">Add member</button></div>`:'<p class="mut">The team is full at 3 members.</p>'}</div>`}
function addMem(){const n=val('mn');if(!n)return;upd(()=>S.team.push({id:Date.now(),n,email:val('me'),role:val('mr')}))}
function alertList(){const a=[];S.tasks.filter(t=>!t.done&&t.date&&t.date<today).forEach(t=>a.push(['Overdue task: '+t.t,cn(t.client)+', due '+t.date]));S.invoices.filter(i=>i.status!='paid'&&i.due&&i.due<today).forEach(i=>a.push(['Overdue invoice: '+money(i.amt),cn(i.client)+', due '+i.due]));return a}
const alertN=()=>alertList().length;
function alerts(){const a=alertList();return `<h2>Alerts</h2><div class="card">${a.map(x=>`<div class="row"><div class="grow">${esc(x[0])}<div class="mut">${esc(x[1])}</div></div></div>`).join('')||'<p class="mut">Nothing overdue.</p>'}</div>`}
function srch(v){Q=v;V=v?'search':'home';render();const e=$('q');e.focus();e.setSelectionRange(v.length,v.length)}
function search(){const q=Q.toLowerCase(),cs=S.clients.filter(c=>(c.name+c.kind).toLowerCase().includes(q)),ts=S.tasks.filter(t=>t.t.toLowerCase().includes(q));return `<h2>Search</h2><div class="card"><h3>Clients</h3>${cs.map(c=>`<div class="row"><button class="x" style="color:var(--tx)" onclick="Q='';go('client',${c.id})">${esc(c.name)}</button><span class="mut grow">${esc(c.kind)}</span></div>`).join('')||'<p class="mut">No clients match.</p>'}<h3 style="margin-top:12px">Tasks</h3>${ts.map(taskRow).join('')||'<p class="mut">No tasks match.</p>'}</div>`}
function seeClient(c){return `<p><span class="pill warn">Client view</span> <button class="btn" onclick="SAC=false;render()">Back to studio view</button></p><h2>${esc(c.name)}</h2><p class="sub">${esc(c.kind)}, ${PH[Math.min(c.phase,3)]}</p><div class="phases">${PH.map((p,i)=>`<div style="padding:12px 14px;background:var(--panel);border-right:1px solid var(--line);${i==Math.min(c.phase,3)?'box-shadow:inset 0 -2px var(--ac);':''}color:${i<=c.phase?'var(--tx)':'var(--mut)'}">${i<c.phase?'Done: ':''}${p}</div>`).join('')}</div><div class="grid"><div class="card"><h3>Documents</h3>${(c.docs||[]).map(d=>`<div class="row"><span class="grow">${esc(d.t)}</span><span class="pill">${d.status}</span></div>`).join('')||'<p class="mut">Nothing shared yet.</p>'}</div><div class="card"><h3>Invoices</h3>${S.invoices.filter(i=>i.client==c.id).map(i=>`<div class="row"><span class="grow">${money(i.amt)}</span><span class="pill">${i.status=='paid'?'Paid':'Unpaid'}</span></div>`).join('')||'<p class="mut">No invoices.</p>'}</div></div>`}
function finTabs(){return `<div class="tabs"><button class="btn ${FT=='o'?'pri':''}" onclick="FT='o';render()">Overview</button><button class="btn ${FT=='s'?'pri':''}" onclick="FT='s';render()">Subscriptions</button></div>`}
function subs(){const m=S.subs.reduce((a,s)=>a+(s.cycle=='Yearly'?s.amt/12:s.amt),0);return `<h2>Finance</h2>${finTabs()}<div class="stats" style="grid-template-columns:repeat(3,1fr)"><div><span>A month</span><b>${money(Math.round(m))}</b></div><div><span>A year</span><b>${money(Math.round(m*12))}</b></div><div><span>Subscriptions</span><b>${S.subs.length}</b></div></div><div class="card">${S.subs.map(s=>`<div class="row"><button class="x grow" style="color:var(--tx);text-align:left" onclick="ES=${s.id};render()">${esc(s.n)}<div class="mut">${s.cat}, ${s.cycle}, next ${s.next||'not set'}</div></button>${money(s.amt)}<button class="x" aria-label="Delete subscription" onclick="upd(()=>S.subs=S.subs.filter(x=>x.id!=${s.id}))">✕</button></div>`).join('')||'<p class="mut">No subscriptions yet. Add Figma, rent or anything that repeats.</p>'}<div class="add"><input id="sn" placeholder="Name"><input id="sa" type="number" min="0" placeholder="Amount"><select id="sc"><option>Monthly</option><option>Yearly</option></select><input id="sd" type="date"><select id="sk"><option>Software</option><option>Rent</option><option>Salaries</option><option>Other</option></select><button class="btn pri" onclick="addSub()">Add subscription</button></div></div>${ES?subModal():''}`}
function addSub(){const n=val('sn'),a=+val('sa');if(!n||!a)return;upd(()=>S.subs.push({id:Date.now(),n,amt:a,cycle:val('sc'),next:val('sd'),cat:val('sk')}))}
function processes(){const P=S.process,p=P[PR]||P[0];return `<h2>Processes</h2><p class="sub">Brand project</p><div class="add" style="margin:0 0 14px"><button class="btn" onclick="applyP()">Apply to ${S.clients.length} projects</button></div><div class="grid p"><div class="card"><h3>${p.n}</h3><p class="mut">${p.d}</p><div class="row"><span class="grow mut">What the client sees</span><span class="grow mut">What your team does</span></div>${p.steps.map((s,i)=>`<div class="row" style="align-items:flex-start"><div class="grow"><b>${esc(s.t)}</b><div class="mut">${s.k}</div></div><div class="grow">${s.tasks.map((t,j)=>`<div>${esc(t)} <button class="x" aria-label="Delete task" onclick="upd(()=>S.process[${PR}].steps[${i}].tasks.splice(${j},1))">✕</button></div>`).join('')}<input id="pt${i}" placeholder="Add a task" style="width:100%;margin-top:4px"><button class="btn" style="margin-top:4px" onclick="addPT(${i})">Add a task</button></div><button class="x" aria-label="Delete step" onclick="upd(()=>S.process[${PR}].steps.splice(${i},1))">✕</button></div>`).join('')}<div class="add"><input id="ns" placeholder="New step"><select id="nk"><option>A document</option><option>The proposal</option><option>The contract</option><option>An invoice</option><option>The workshop</option></select><button class="btn pri" onclick="addPS()">New step</button></div></div><div class="card"><h3>Phases</h3>${P.map((x,i)=>`<div class="row"><button class="x" style="color:${i==PR?'var(--ac)':'var(--tx)'}" onclick="PR=${i};render()">${i+1}. ${x.n}</button><span class="mut grow" style="text-align:right">${x.steps.length} steps</span></div>`).join('')}</div></div>`}
function addPT(i){const t=val('pt'+i);if(!t)return;upd(()=>S.process[PR].steps[i].tasks.push(t))}
function addPS(){const t=val('ns');if(!t)return;upd(()=>S.process[PR].steps.push({t,k:val('nk'),tasks:[]}))}
function applyP(){upd(()=>S.clients.forEach(c=>{c.steps=c.steps||{};S.process.forEach((ph,i)=>{if(!(c.steps[i]||[]).length)c.steps[i]=ph.steps.map(s=>({id:Date.now()+Math.random(),t:s.t,status:'Draft'}))})}))}
function client(){const c=S.clients.find(x=>x.id==CID);if(!c){V='clients';return clients()}
 if(SAC)return seeClient(c);
 if(CT!='dashboard')return clientPage(c);
 const pv=PV??Math.min(c.phase,3),cp=Math.min(c.phase,3);
 return `<p><button class="x" onclick="go('clients')">Back to clients</button></p><h2>${esc(c.name)}</h2><p class="sub">${esc(c.kind)}${c.due?' · due '+c.due:''}</p>
 <div class="phases">${PH.map((p,i)=>`<button class="${i<c.phase?'done':''} ${i==pv?'cur':''}" onclick="PV=${i};render()">${i<c.phase?'Done: ':''}${p}</button>`).join('')}</div>
 <div class="grid p"><div class="card"><h3>The process</h3>${((c.steps||{})[pv]||[]).map(s=>stepRow(c.id,pv,s)).join('')||'<p class="mut">No steps in this phase yet. Add the first one below.</p>'}<div class="add"><input id="st" placeholder="New step"><button class="btn pri" onclick="addStep(${c.id},${pv})">New step</button>${pv==c.phase?`<button class="btn" onclick="upd(()=>S.clients.find(x=>x.id==${c.id}).phase=${c.phase+1})">Finish ${PH[pv]}</button>`:''}</div></div>
 <div class="card"><h3>Project</h3><input aria-label="Project name" value="${esc(c.kind)}" onchange="upd(()=>S.clients.find(x=>x.id==${c.id}).kind=this.value)" style="width:100%;margin-bottom:6px"><input aria-label="About the project" placeholder="Add a line about the project" value="${esc(c.about||'')}" onchange="upd(()=>S.clients.find(x=>x.id==${c.id}).about=this.value)" style="width:100%;margin-bottom:10px"><div class="row"><span class="grow mut">Status</span><span class="pill ${c.phase>=4?'ok':'warn'}">${c.phase>=4?'Complete':'Active'}</span></div><div class="row"><span class="grow mut">Phase</span>${PH[cp]}, ${cp+1} of 4</div><div class="row"><span class="grow mut">Started</span><input type="date" aria-label="Start date" value="${c.started||''}" onchange="upd(()=>S.clients.find(x=>x.id==${c.id}).started=this.value)"></div><div class="row"><span class="grow mut">Due</span><input type="date" aria-label="Due date" value="${c.due||''}" onchange="upd(()=>S.clients.find(x=>x.id==${c.id}).due=this.value)"></div><h3 style="margin-top:14px">People</h3>${(c.people||[]).map((p,i)=>`<div class="row"><span class="grow">${esc(p)}</span><button class="x" aria-label="Remove person" onclick="upd(()=>S.clients.find(x=>x.id==${c.id}).people.splice(${i},1))">✕</button></div>`).join('')||'<p class="mut">No one added yet.</p>'}<div class="add"><input id="pp" placeholder="Add a person"><button class="btn" onclick="addPerson(${c.id})">Add person</button></div></div></div>
 <div class="grid"><div class="card"><h3>Tasks</h3>${S.tasks.filter(t=>t.client==c.id).map(taskRow).join('')||'<p class="mut">No tasks for this client.</p>'}</div>
 <div class="card"><h3>Invoices</h3>${invList(S.invoices.filter(i=>i.client==c.id))}</div></div>`}
render();
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})</script></body></html>
